[project]
name = "birthday-filter"
version = "0.1.0"
description = "Creates a copy of a birthday calendar filtered to only specific people"
authors = [
    {name = "Radian LLC",email = "contact+birthday-filter@radian.codes"}
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "vdirsyncer (>=0.20.0,<0.21.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "vobject (>=0.9.9,<0.10.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
